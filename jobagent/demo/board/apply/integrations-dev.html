<!doctype html>
<html><head><meta charset="utf-8"><title>Apply: Integrations Developer (1/2)</title></head>
<body><main>
<h1>Integrations Developer: step 1 of 2</h1>
<form action="integrations-dev-2.html" method="get">
  <label for="em">Email</label> <input id="em" name="em" type="email" required>
  <label for="li">LinkedIn profile</label> <input id="li" name="li" required>
  <fieldset>
    <legend>Are you authorized to work remotely from your country?</legend>
    <div><input type="radio" name="auth" value="1" required><span>Yes</span></div>
    <div><input type="radio" name="auth" value="0"><span>No</span></div>
  </fieldset>
  <div>
    <p>Will you now or in the future require visa sponsorship? *</p>
    <label><input type="radio" name="visa" value="y" required>Yes</label>
    <label><input type="radio" name="visa" value="n">No</label>
  </div>
  <button type="submit">Next</button>
</form>
</main></body></html>
