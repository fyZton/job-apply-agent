[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
description = "AI job-application agent with per-board plugins and honesty checks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
api = ["anthropic>=1.0"]
cv = ["pypdf>=4", "python-docx>=1.1"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools.packages.find]
include = ["jobagent*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"jobagent/forms.py" = ["E501"]  # embedded JavaScript

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
jobagent = ["demo/*.yaml", "demo/cv/*", "demo/board/*.html", "demo/board/*/*.html"]
