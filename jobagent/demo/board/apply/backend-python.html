<!doctype html>
<html><head><meta charset="utf-8"><title>Apply: Backend Developer (Python)</title></head>
<body><main>
<h1>Backend Developer (Python)</h1>
<form action="../sent.html" method="get">
  <label for="fn">First name</label> <input id="fn" name="fn" required>
  <label for="ln">Last name</label> <input id="ln" name="ln" required>
  <label for="em">Email</label> <input id="em" name="em" type="email" required>
  <label for="ph">Phone</label> <input id="ph" name="ph" required>
  <label for="yp">Years of experience with Python</label> <input id="yp" name="yp" type="number" required>
  <label for="why">Why do you want to work here?</label> <textarea id="why" name="why" required></textarea>
  <label for="cv">Resume / CV</label> <input id="cv" name="cv" type="file">
  <button type="submit">Submit application</button>
</form>
</main></body></html>
