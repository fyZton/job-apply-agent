# Copy to profile.yaml, or run `python -m jobagent --setup` to fill it in step by step.
# The LLM answers forms ONLY from this file: it never invents experience.
# This example is a fictional candidate.

version: 2
first_name: Alex
last_name: Example
email: alex@example.com
phone: "+58 400 000 0000"
city: Caracas
country: Venezuela
timezone: UTC-4
linkedin: https://www.linkedin.com/in/alex-example
github: https://github.com/alex-example

work_mode: 100% remote only.
open_to_contractor: yes
needs_visa_sponsorship: no
available_to_start: 2 weeks
expected_salary_usd_monthly: 1800

# Facts are what the agent may claim. Each has a stable id; answers cite those ids and anything that is not
# here is answered as 0 or left for you. Ids are written once and never change, so keep them when you edit.
# kinds: skill (years), cert (year), experience (title, org, start, end, bullets), education, language (level).
facts:
  - {id: skill.software-development, kind: skill, name: Software development, years: 3}
  - {id: skill.python, kind: skill, name: Python, years: 3}
  - {id: skill.sql, kind: skill, name: SQL, years: 2}
  - {id: skill.rest-apis-and-integrations, kind: skill, name: REST APIs and integrations, years: 2}
  - {id: skill.docker, kind: skill, name: Docker, years: 1}
  - {id: cert.aws-ccp, kind: cert, name: AWS Cloud Practitioner, year: 2024}
  - id: exp.acme-2023
    kind: experience
    title: Backend Developer
    org: Acme
    start: 2023-01
    end: present
    bullets:
      - {id: exp.acme-2023.b1, text: Built REST integrations between internal services and partner APIs}
      - {id: exp.acme-2023.b2, text: Automated a weekly reporting job in Python}
  - {id: edu.bsc-computer-science, kind: education, name: B.Sc. Computer Science, year: 2023}
  - {id: lang.english, kind: language, name: English, level: B2}
  - {id: lang.spanish, kind: language, name: Spanish, level: Native}

summary: >
  Developer focused on backend and integrations: REST APIs, webhooks and automation.

# Extra rules for scoring offers (passed to the LLM as-is).
screening_rules:
  - Only accepts 100% remote work. On-site or hybrid offers (any city) get fit 1.
  - If the offer requires living in a country that excludes Venezuela, fit 1.
  - Offers that require relocation get fit 1.
  - Offers that ask for 5+ years of experience get fit at most 3.

# Answers without LLM. "pattern" is a regex over the question; the first match wins.
fixed_answers:
  - {pattern: "e-?mail|correo", value: "alex@example.com"}
  - {pattern: "phone|teléfono|telefono|celular", value: "4000000000"}
  - {pattern: 'first name|^\s*nombre\s*\*?\s*$', value: "Alex"}
  - {pattern: "last name|surname|apellido", value: "Example"}
  - {pattern: "linkedin", value: "https://www.linkedin.com/in/alex-example"}
  - {pattern: "github|portfolio|portafolio|website", value: "https://github.com/alex-example"}
  - {pattern: "sponsorship|patrocinio", value: "No"}
  - {pattern: "relocat|reubica|mudarse", value: "No"}
